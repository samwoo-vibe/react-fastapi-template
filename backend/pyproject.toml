[project]
name = "samwoo-vibe-backend"
version = "0.1.0"
description = "Samwoo Vibe citizen development FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.16.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.2.9",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.41",
    "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
