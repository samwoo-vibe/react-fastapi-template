services:
  frontend:
    build:
      context: ./frontend
      args:
        NODE_OPTIONS: --max-old-space-size=1536
    restart: unless-stopped
    labels:
      # 공개 서비스인 frontend는 Coolify 네트워크 하나에만 붙으므로 Traefik이 고를
      # 여지가 없다. 다만 frontend에 database 네트워크를 추가하는 순간 이야기가
      # 달라진다 - 라벨이 비면 Traefik이 임의로 골라 외부 접속이 간헐적으로 끊긴다.
      # 그때는 :-기본값에 앱 네트워크 이름을 적는다(사내 배포 규약 R3-3).
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # 실측 후 조정한다(사내 배포 규약 R3-6, 13장). 타입 검사·번들링은 메모리를 많이 쓴다.
    mem_limit: 512m

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured in Coolify}
      APP_ENV: ${APP_ENV:-dev}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    networks:
      - default
      - database

networks:
  database:
    external: true
    name: samwoo-postgres-prod
