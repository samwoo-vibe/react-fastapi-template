map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https   https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api(?:/|$) {
        # Keep /api in the upstream request path. FastAPI's root_path removes it
        # for route matching while Starlette retains it in redirect URLs.
        client_max_body_size 50m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Uvicorn trusts this dynamically addressed frontend proxy. Never append
        # a client-supplied chain: replace it with the direct proxy peer so an
        # application cannot mistake an attacker-controlled value for identity.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
